# ============================================================
# CONFIGURACIÓN SPRING BOOT - MANTENIMIENTO DULZÓN S.A.
# ============================================================

server.port=8080

# ── MariaDB ──
spring.datasource.url=jdbc:mariadb://localhost:3306/dulzon_mantenimiento?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ── Logging ──
logging.level.root=INFO
logging.level.com.dulzonSA.mantenimiento=DEBUG
logging.level.org.hibernate.SQL=DEBUG
